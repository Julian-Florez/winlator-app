apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

def configuredCoreConfig = System.getenv('WIN2APK_CONFIG')?.trim()
def coreConfigFile = configuredCoreConfig ? new File(configuredCoreConfig) : rootProject.file('../../config/win2apk.json')
if (!coreConfigFile.isFile()) {
    throw new GradleException("Missing Winlator Core configuration: ${coreConfigFile}")
}

def coreConfig = new JsonSlurper().parse(coreConfigFile)
def coreRepositoryDir = rootProject.file('../..')
def coreProject = coreConfig.project ?: coreConfig.app
def corePayload = coreConfig.payload ?: coreConfig.app
def coreAppName = (coreProject.name ?: coreProject.folderName).toString()
def coreApplicationId = coreConfig.android.applicationId.toString()
def coreLabel = coreAppName
def coreRootfsPackageId = (coreConfig.android.rootfsPackageId ?: 'com.winlator').toString()
def coreRootfsPathAlias = (coreConfig.android.rootfsPathAlias ?: '/proc/self/fd/3').toString()
def coreRootfsPathPrefix = "/data/data/${coreRootfsPackageId}"
if (!coreRootfsPathAlias.startsWith('/') || coreRootfsPathAlias.contains(' ') || coreRootfsPathAlias.length() > coreRootfsPathPrefix.length()) {
    throw new GradleException("rootfsPathAlias must be an absolute path without spaces and no longer than '${coreRootfsPathPrefix}'")
}
def coreRootfsAliasBytes = (coreRootfsPathAlias + '/' * (coreRootfsPathPrefix.length() - coreRootfsPathAlias.length())).getBytes('UTF-8')
def coreAssetPackNames = (corePayload.assetPackNames ?: []).collect { it.toString().trim() }.findAll { !it.isEmpty() }
if (coreAssetPackNames.isEmpty()) throw new GradleException('No generated asset packs were configured')

def coreSourceAssetsDir = file('src/main/assets')
def coreGeneratedAssetsDir = file("${buildDir}/generated/core-assets")
def corePathRewriteAssets = (coreConfig.android.pathRewriteAssets ?: []).collect { it.toString() }
def configuredIconResources = System.getenv('WIN2APK_ICON_RES_DIR')?.trim()
def coreGeneratedIconResDir = configuredIconResources ? new File(configuredIconResources) : null
if (coreGeneratedIconResDir == null || !coreGeneratedIconResDir.isDirectory()) {
    throw new GradleException('WIN2APK_ICON_RES_DIR must point to launcher resources generated by the CLI')
}
def configuredPayloadManifest = System.getenv('WIN2APK_PAYLOAD_MANIFEST')?.trim()
def corePayloadManifest = configuredPayloadManifest ? new File(configuredPayloadManifest) : new File(coreConfigFile.parentFile, 'payload-manifest.json')
if (!corePayloadManifest.isFile()) {
    throw new GradleException("Missing generated payload manifest: ${corePayloadManifest}")
}

def indexOfBytes = { byte[] source, byte[] target, int fromIndex, int endIndex ->
    if (target.length == 0) return fromIndex
    int lastStart = endIndex - target.length
    for (int index = fromIndex; index <= lastStart; index++) {
        boolean matches = true
        for (int offset = 0; offset < target.length; offset++) {
            if (source[index + offset] != target[offset]) {
                matches = false
                break
            }
        }
        if (matches) return index
    }
    return -1
}

def rewriteFixedLengthFile = { File source, File target, byte[] oldBytes, byte[] newBytes ->
    int replacementCount = 0
    int overlap = oldBytes.length - 1
    byte[] buffer = new byte[1024 * 1024 + overlap]
    source.withInputStream { input ->
        target.withOutputStream { output ->
            int tailLength = 0
            int read
            while ((read = input.read(buffer, tailLength, 1024 * 1024)) > 0) {
                int total = tailLength + read
                int safeLength = Math.max(0, total - overlap)
                int cursor = 0
                while (cursor < safeLength) {
                    int match = indexOfBytes(buffer, oldBytes, cursor, safeLength + overlap)
                    if (match < 0 || match >= safeLength) {
                        output.write(buffer, cursor, safeLength - cursor)
                        break
                    }
                    output.write(buffer, cursor, match - cursor)
                    output.write(newBytes)
                    replacementCount++
                    cursor = match + oldBytes.length
                }
                tailLength = total - safeLength
                if (tailLength > 0) System.arraycopy(buffer, safeLength, buffer, 0, tailLength)
            }

            int cursor = 0
            while (cursor < tailLength) {
                int match = indexOfBytes(buffer, oldBytes, cursor, tailLength)
                if (match < 0) {
                    output.write(buffer, cursor, tailLength - cursor)
                    break
                }
                output.write(buffer, cursor, match - cursor)
                output.write(newBytes)
                replacementCount++
                cursor = match + oldBytes.length
            }
        }
    }
    return replacementCount
}

def transformCoreArchive = { File source, File target, byte[] oldBytes, byte[] newBytes ->
    File tempDir = File.createTempDir('win2apk-asset-', '')
    File expandedTar = new File(tempDir, 'asset.tar')
    File rewrittenTar = new File(tempDir, 'asset-rewritten.tar')
    try {
        project.exec {
            commandLine 'zstd', '-q', '-d', '-f', source.absolutePath, '-o', expandedTar.absolutePath
        }
        int replacements = rewriteFixedLengthFile(expandedTar, rewrittenTar, oldBytes, newBytes)
        target.parentFile.mkdirs()
        project.exec {
            commandLine 'zstd', '-q', '-T0', '-f', rewrittenTar.absolutePath, '-o', target.absolutePath
        }
        logger.lifecycle("Win2APK Core: ${source.name} -> ${target.name} (${replacements} path replacements)")
    } finally {
        tempDir.deleteDir()
    }
}

def prepareCoreAssets = tasks.register('prepareCoreAssets') {
    inputs.dir(coreSourceAssetsDir)
    inputs.file(coreConfigFile)
    inputs.file(corePayloadManifest)
    inputs.property('rootfsPackageId', coreRootfsPackageId)
    inputs.property('applicationId', coreApplicationId)
    outputs.dir(coreGeneratedAssetsDir)

    inputs.property('rootfsPathAlias', coreRootfsPathAlias)
    doLast {
        if (coreGeneratedAssetsDir.exists()) coreGeneratedAssetsDir.deleteDir()
        coreGeneratedAssetsDir.mkdirs()

        copy {
            from coreSourceAssetsDir
            into coreGeneratedAssetsDir
            exclude corePathRewriteAssets
            exclude 'win2apk.json'
            exclude 'payload-manifest.json'
        }

        copy {
            from coreConfigFile
            into coreGeneratedAssetsDir
            rename { 'win2apk.json' }
        }
        copy {
            from corePayloadManifest
            into coreGeneratedAssetsDir
            rename { 'payload-manifest.json' }
        }

        byte[] oldRootfsPathBytes = coreRootfsPathPrefix.getBytes('UTF-8')

        corePathRewriteAssets.each { relativePath ->
            File source = new File(coreSourceAssetsDir, relativePath)
            if (!source.isFile()) throw new GradleException("Missing path-rewrite asset: ${source}")
            File target = new File(coreGeneratedAssetsDir, relativePath)
            transformCoreArchive(source, target, oldRootfsPathBytes, coreRootfsAliasBytes)
        }
    }
}

def signWithGradle = System.getenv('WIN2APK_SIGN_WITH_GRADLE') == 'true'
def releaseKeystore = System.getenv('WIN2APK_KEYSTORE')?.trim()
def releaseAlias = System.getenv('WIN2APK_KEY_ALIAS')?.trim()
def releaseStorePassword = System.getenv('WIN2APK_STORE_PASSWORD')
def releaseKeyPassword = System.getenv('WIN2APK_KEY_PASSWORD')
if (signWithGradle && ![releaseKeystore, releaseAlias, releaseStorePassword, releaseKeyPassword].every { it }) {
    throw new GradleException('Release signing variables were not supplied by Win2APK CLI')
}

project.android {
    // Keep the Java/Kotlin source namespace stable; the generated package ID
    // remains configurable through coreApplicationId.
    namespace 'com.winlator'
    compileSdk 36

    defaultConfig {
        applicationId coreApplicationId
        minSdkVersion 26
        // Winlator executes Box64/Wine binaries extracted below files/rootfs.
        // Android's target-29+ SELinux policy denies execute_no_trans for
        // app_data_file, so keep the legacy target required by this runtime
        // until the binaries are relocated into an executable APK-owned path.
        targetSdkVersion 28
        versionCode coreConfig.android.versionCode as int
        versionName coreConfig.android.versionName.toString()
        manifestPlaceholders = [
                appLabel: coreLabel,
                launcherIcon: '@mipmap/win2apk_launcher',
                launcherRoundIcon: '@mipmap/win2apk_launcher_round'
        ]

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DWINLATOR_APP_CACHE_DIR=/data/data/${coreApplicationId}/cache",
                        "-DWINLATOR_VORTEK_SERVER_PATH=/data/data/${coreApplicationId}/files/rootfs/tmp/.vortek/V0",
                        "-DWINLATOR_X11_SERVER_PATH=/data/data/${coreApplicationId}/files/rootfs/tmp/.X11-unix/X0"
            }
        }
    }

    assetPacks = coreAssetPackNames.collect { ':' + it }

    if (signWithGradle) {
        signingConfigs {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signWithGradle) signingConfig signingConfigs.release
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    packagingOptions {
        // libadrenotools installs a runtime hook from the extracted native
        // library directory; keep legacy extraction while the ELF audit is
        // completed for every prebuilt dependency.
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ['**/*.so']
        }
        // The legacy strip phase rewrites 16 KB ELF program headers to 4 KB.
        // Preserve the headers in the packaged artifact until every native
        // dependency is rebuilt with the same page-size contract.
        doNotStrip '**/libfile_redirect_hook.so'
        doNotStrip '**/libgladiorenderer.so'
        doNotStrip '**/libgsl_alloc_hook.so'
        doNotStrip '**/libhook_impl.so'
        doNotStrip '**/libmain_hook.so'
        doNotStrip '**/libmidihandler.so'
        doNotStrip '**/libomp.so'
        doNotStrip '**/libvirglrenderer.so'
        doNotStrip '**/libvortekrenderer.so'
        doNotStrip '**/libwinlator.so'
        doNotStrip '**/libVkLayer_BCN_BCnLayer.so'
        doNotStrip '**/libbcn_layer.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libFLAC.so'
        pickFirst 'lib/arm64-v8a/libfluidsynth.so'
        pickFirst 'lib/arm64-v8a/libfluidsynth-assetloader.so'
        pickFirst 'lib/arm64-v8a/libgio-2.0.so'
        pickFirst 'lib/arm64-v8a/libglib-2.0.so'
        pickFirst 'lib/arm64-v8a/libgmodule-2.0.so'
        pickFirst 'lib/arm64-v8a/libgobject-2.0.so'
        pickFirst 'lib/arm64-v8a/libgthread-2.0.so'
        pickFirst 'lib/arm64-v8a/libinstpatch-1.0.so'
        pickFirst 'lib/arm64-v8a/liboboe.so'
        pickFirst 'lib/arm64-v8a/libogg.so'
        pickFirst 'lib/arm64-v8a/libopus.so'
        pickFirst 'lib/arm64-v8a/libpcre.so'
        pickFirst 'lib/arm64-v8a/libpcreposix.so'
        pickFirst 'lib/arm64-v8a/libsndfile.so'
        pickFirst 'lib/arm64-v8a/libvorbis.so'
        pickFirst 'lib/arm64-v8a/libvorbisenc.so'
        pickFirst 'lib/arm64-v8a/libvorbisfile.so'
    }

    ndkVersion '30.0.15729638'

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

android.sourceSets.main.assets.setSrcDirs([coreGeneratedAssetsDir])
android.sourceSets.main.res.srcDir(coreGeneratedIconResDir)

tasks.named('preBuild').configure {
    dependsOn prepareCoreAssets
}

// Large AABs are signed by the CLI with jarsigner. AGP's AabFlinger keeps the
// complete ZIP source table in memory and fails on multi-gigabyte payloads.
// The IDE-listing tasks consume AGP's final signed output, so disable them as
// well when the CLI deliberately leaves signing to the external signer.
tasks.matching {
    it.name in ['signReleaseBundle', 'produceReleaseBundleIdeListingFile', 'createReleaseBundleListingFileRedirect']
}.configureEach {
    enabled = signWithGradle
}

// AGP's strip task in this legacy project rewrites the p_align field of the
// CMake outputs from 0x4000 to 0x1000. Restore the exact merged ELF files
// after stripping so the packaged artifact keeps the linker contract.
tasks.matching { it.name == 'stripDebugDebugSymbols' }.configureEach {
    doLast {
        File mergedNativeLibs = file("${buildDir}/intermediates/merged_native_libs/debug/mergeDebugNativeLibs/out/lib")
        File packagedNativeLibs = file("${buildDir}/intermediates/stripped_native_libs/debug/out/lib")
        if (!mergedNativeLibs.isDirectory() || !packagedNativeLibs.isDirectory()) {
            throw new GradleException("16 KB native restore paths are missing: ${mergedNativeLibs} -> ${packagedNativeLibs}")
        }
        copy {
            from mergedNativeLibs
            into packagedNativeLibs
            include '**/libfile_redirect_hook.so'
            include '**/libgladiorenderer.so'
            include '**/libgsl_alloc_hook.so'
            include '**/libhook_impl.so'
            include '**/libmain_hook.so'
            include '**/libmidihandler.so'
            include '**/libomp.so'
            include '**/libvirglrenderer.so'
            include '**/libvortekrenderer.so'
            include '**/libwinlator.so'
        }
        logger.lifecycle("Win2APK 16 KB: restored merged ELF headers after stripDebugDebugSymbols")
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.google.android.play:asset-delivery:2.3.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
}
